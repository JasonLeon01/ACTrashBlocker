name: Build and release Chrome extension

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact-name: ACTrashBlocker-v${{ steps.package.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate and package extension
        run: python scripts/package.py

      - name: Read package version and validate release tag
        id: package
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('extension/manifest.json').read_text(encoding='utf-8'))['version']
          if os.environ['EVENT_NAME'] == 'push' and os.environ['REF_TYPE'] == 'tag':
              tag = os.environ['REF_NAME']
              if tag not in (version, f'v{version}'):
                  raise SystemExit(
                      f'Invalid release tag {tag!r}: expected {version!r} or {f"v{version}"!r} '
                      'to match extension/manifest.json exactly.'
                  )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')

      - name: Upload ZIP and checksum
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ACTrashBlocker-v${{ steps.package.outputs.version }}
          path: |
            dist/ACTrashBlocker-v${{ steps.package.outputs.version }}.zip
            dist/ACTrashBlocker-v${{ steps.package.outputs.version }}.zip.sha256
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Write build summary
        shell: python
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          import os
          from pathlib import Path
          version = os.environ['PACKAGE_VERSION']
          checksum = Path(f'dist/ACTrashBlocker-v{version}.zip.sha256').read_text(encoding='utf-8').strip()
          summary = f'''## ACTrashBlocker v{version}

          - [Download build artifacts]({os.environ['ARTIFACT_URL']}) (retained for 30 days).
          - Extension package: `ACTrashBlocker-v{version}.zip`
          - SHA-256: `{checksum}`
          - Download and extract the Actions artifact archive, then extract the extension ZIP inside it.
          - In Chrome 127+, open `chrome://extensions`, enable Developer mode, and select **Load unpacked**. Choose the directory containing `manifest.json`.
          - Pin the extension to the toolbar and open a Bilibili home or video page.

          This build validates and packages source files without making account block requests.
          A successful tag push publishes these files as GitHub Release assets.
          '''
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_NOTES_FILE: ACTrashBlocker-release-notes.md
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Verify release assets and prepare English notes
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          version = os.environ['PACKAGE_VERSION']
          tag = os.environ['RELEASE_TAG']
          if tag not in (version, f'v{version}'):
              raise SystemExit('The release tag does not match the validated package version.')
          archive = Path(f'dist/ACTrashBlocker-v{version}.zip')
          checksum = archive.with_suffix('.zip.sha256').read_text(encoding='utf-8').split()
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if checksum != [digest, archive.name]:
              raise SystemExit('The release ZIP does not match its SHA-256 checksum.')
          with zipfile.ZipFile(archive) as bundle:
              if bundle.testzip() is not None:
                  raise SystemExit('The release ZIP failed its integrity check.')
              manifest = json.loads(bundle.read('manifest.json'))
              if manifest.get('version') != version:
                  raise SystemExit('The packaged manifest version does not match the release tag.')

          notes = f'''## ACTrashBlocker {tag}

          Download **{archive.name}** from the release assets below. The matching `.sha256` file is available for integrity verification.

          ### Installation

          1. Extract the extension ZIP to a folder you will keep on your computer.
          2. In Chrome 127 or later, open `chrome://extensions` and enable **Developer mode**.
          3. Select **Load unpacked** and choose the folder containing `manifest.json`.
          4. Pin ACTrashBlocker to the toolbar and open a Bilibili home or video page.

          The extension identifies explicitly marked promotional videos. Account blocks are performed only after you click a block button while signed in to Bilibili.

          ### SHA-256

          ```text
          {digest}  {archive.name}
          ```
          '''
          notes_path = Path(os.environ['RUNNER_TEMP']) / os.environ['RELEASE_NOTES_FILE']
          notes_path.write_text(notes, encoding='utf-8')

      - name: Create release or update its assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="dist/ACTrashBlocker-v${PACKAGE_VERSION}.zip"
          checksum="${archive}.sha256"
          if is_draft="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            gh release upload "$RELEASE_TAG" "$archive" "$checksum" \
              --repo "$GH_REPO" --clobber
            if [ "$is_draft" = 'true' ]; then
              gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --verify-tag
            fi
            printf 'Updated release assets. Existing release notes and title were preserved.\n'
          else
            gh release create "$RELEASE_TAG" "$archive" "$checksum" \
              --repo "$GH_REPO" --verify-tag \
              --title "ACTrashBlocker ${RELEASE_TAG}" \
              --notes-file "${RUNNER_TEMP}/${RELEASE_NOTES_FILE}" \
              --draft=false --prerelease=false
          fi
          release_url="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url')"
          printf '## GitHub Release\n\n[ACTrashBlocker %s](%s)\n' \
            "$RELEASE_TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"
